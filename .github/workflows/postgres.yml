name: PostgreSQL + API verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: telco_owner
          POSTGRES_PASSWORD: ci-only-owner-password
          POSTGRES_DB: telco_test_ci
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U telco_owner -d telco_test_ci" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      OWNER: postgresql://telco_owner:ci-only-owner-password@localhost:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: CI-only random secrets (never reused)
        run: python scripts/dev_secrets.py ci.env && cat ci.env >> "$GITHUB_ENV"
      - run: python -m unittest tests.test_core -v
      - name: Generate + validate dataset (seed 42)
        run: |
          python -m telco.generate --out data/full --seed 42
          python -m telco.validate_csv data/full --report reports/csv_validation_ci.json
      - name: Template DB (migrate x2, load 500k, validate, refuse 2nd load, security, roles, demo)
        run: |
          psql "$OWNER/telco_test_ci" -c 'CREATE DATABASE telco_test_template'
          export DATABASE_URL="$OWNER/telco_test_template" ADMIN_DATABASE_URL="$OWNER/telco_test_template"
          python -m telco.db migrate && python -m telco.db migrate
          python -m telco.db load --data data/full
          python -m telco.db validate
          ! python -m telco.db load --data data/full
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -f sql/security.sql
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -f sql/security_platform.sql
          psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -f sql/validate_platform.sql
          python -m telco_api.provision roles
          export READER_DATABASE_URL="postgresql://telco_api_reader:${TELCO_API_READER_PASSWORD}@localhost:5432/telco_test_template"
          export WRITER_DATABASE_URL="postgresql://telco_api_writer:${TELCO_API_WRITER_PASSWORD}@localhost:5432/telco_test_template"
          OPS_DATABASE_URL="postgresql://telco_ops_login:${TELCO_OPS_PASSWORD}@localhost:5432/telco_test_template" python -m telco_api.provision demo
      - name: Reference server tests
        env: {DATABASE_URL: "postgresql://telco_owner:ci-only-owner-password@localhost:5432/telco_test_ci"}
        run: python -m pytest tests/test_postgres.py -v
      - name: Platform tests (clone of template)
        env: {TEST_ADMIN_DATABASE_URL: "postgresql://telco_owner:ci-only-owner-password@localhost:5432/postgres", TEST_TEMPLATE_DB: telco_test_template}
        run: python -m pytest tests -v --ignore=tests/test_postgres.py
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Dashboard typecheck + build
        working-directory: dashboard
        run: npm ci --no-audit --no-fund && npm run build
