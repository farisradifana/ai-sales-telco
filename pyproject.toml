[project]
name = "telco-sales-ai"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
description = "TELCO Sales AI: PostgreSQL reference + domain API + MCP bridge (synthetic data only)"

[tool.setuptools]
packages = ["telco", "telco_api", "telco_mcp"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "pg: needs a disposable telco_test_* PostgreSQL (TEST_ADMIN_DATABASE_URL)",
  "slow: long-running",
  "e2e: end-to-end with mock external services",
]
