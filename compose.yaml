services:
  postgres:
    image: postgres:17.11
    environment:
      POSTGRES_DB: telco
      POSTGRES_USER: telco_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - telco_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telco_owner -d telco"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  telco_pg:
