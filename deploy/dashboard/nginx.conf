# Same-origin gateway: static dashboard + /v1 and /charts proxied to the private API. Webhooks are NOT exposed here.
server {
  listen 8080;
  server_tokens off;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options DENY always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'" always;
  root /usr/share/nginx/html;
  location /v1/ { proxy_pass http://api:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
  location /charts/ { proxy_pass http://api:8000; }
  location / { try_files $uri /index.html; }
}
