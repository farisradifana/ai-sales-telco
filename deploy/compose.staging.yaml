# Staging stack (provider-neutral). Secrets come from deploy/.env.staging (never committed; see .env.example).
#   docker compose -f deploy/compose.staging.yaml --env-file deploy/.env.staging up -d --build
# Only `edge` publishes ports. Everything else sits on the private `backend` network. In cloud deployments replace
# `db` / `n8n-db` with managed PostgreSQL 17 (TLS verify-full) and keep the same env contract.
name: telco-staging

x-api-env: &api-env
  APP_ENV: staging
  READER_DATABASE_URL: postgresql://telco_api_reader:${TELCO_API_READER_PASSWORD}@db:5432/telco
  WRITER_DATABASE_URL: postgresql://telco_api_writer:${TELCO_API_WRITER_PASSWORD}@db:5432/telco
  IDENTITY_DATABASE_URL: postgresql://telco_api_identity:${TELCO_API_IDENTITY_PASSWORD}@db:5432/telco
  JWT_SECRET: ${JWT_SECRET}
  JWT_JWKS_URL: ${JWT_JWKS_URL:-}
  N8N_SERVICE_TOKEN: ${N8N_SERVICE_TOKEN}
  MCP_SERVICE_TOKEN: ${MCP_SERVICE_TOKEN}
  WA_APP_SECRET: ${WA_APP_SECRET}
  WA_VERIFY_TOKEN: ${WA_VERIFY_TOKEN}
  WA_PHONE_NUMBER_ID: ${WA_PHONE_NUMBER_ID:-}
  WA_ACCESS_TOKEN: ${WA_ACCESS_TOKEN:-}
  WA_SEND_MODE: ${WA_SEND_MODE:-disabled}
  WA_LIVE_ALLOWLIST_HMACS: ${WA_LIVE_ALLOWLIST_HMACS:-}
  IDENTITY_ENC_KEY: ${IDENTITY_ENC_KEY}
  IDENTITY_HMAC_KEY: ${IDENTITY_HMAC_KEY}
  CHART_SIGNING_KEY: ${CHART_SIGNING_KEY}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
  N8N_DISPATCH_URL: http://n8n-webhook:5678/webhook/telco-inbound
  N8N_DISPATCH_SECRET: ${N8N_DISPATCH_SECRET}
  HERMES_BASE_URL: http://hermes:8642
  HERMES_API_KEY: ${HERMES_API_KEY}
  ROUTER_BASE_URL: http://router:20128
  ROUTER_API_KEY: ${ROUTER_API_KEY}
  MODEL_ID: ${MODEL_ID}
  FALLBACK_MODEL_ID: ${FALLBACK_MODEL_ID:-}

x-n8n-env: &n8n-env
  DB_TYPE: postgresdb
  DB_POSTGRESDB_HOST: n8n-db
  DB_POSTGRESDB_DATABASE: n8n
  DB_POSTGRESDB_USER: n8n
  DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
  EXECUTIONS_MODE: queue
  QUEUE_BULL_REDIS_HOST: redis
  QUEUE_BULL_REDIS_PASSWORD: ${REDIS_PASSWORD}
  QUEUE_HEALTH_CHECK_ACTIVE: "true"
  N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}          # identical on main, webhook and worker
  N8N_RUNNERS_ENABLED: "true"
  N8N_DIAGNOSTICS_ENABLED: "false"
  N8N_PERSONALIZATION_ENABLED: "false"
  GENERIC_TIMEZONE: Asia/Jakarta
  TZ: Asia/Jakarta
  # 'none' leaves multi-trigger executions stuck 'running' on 2.35.7; store and prune after 24h instead. Execution data
  # holds message ids, narrative text and short-lived signed links only (no phone numbers, no tokens).
  EXECUTIONS_DATA_SAVE_ON_SUCCESS: all
  EXECUTIONS_DATA_SAVE_ON_ERROR: all
  EXECUTIONS_DATA_PRUNE: "true"
  EXECUTIONS_DATA_MAX_AGE: "24"
  N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
  WEBHOOK_URL: http://n8n-webhook:5678/
  N8N_PROXY_HOPS: "1"

services:
  db:
    image: postgres:17.11
    environment: {POSTGRES_DB: telco, POSTGRES_USER: telco_owner, POSTGRES_PASSWORD: "${POSTGRES_OWNER_PASSWORD}"}
    volumes: [telco_pg:/var/lib/postgresql/data]
    networks: [backend]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U telco_owner -d telco"], interval: 5s, timeout: 3s, retries: 20}

  n8n-db:
    image: postgres:17.11
    environment: {POSTGRES_DB: n8n, POSTGRES_USER: n8n, POSTGRES_PASSWORD: "${N8N_DB_PASSWORD}"}
    volumes: [n8n_pg:/var/lib/postgresql/data]
    networks: [backend]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"], interval: 5s, timeout: 3s, retries: 20}

  redis:
    image: redis:8.2.10-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes: [redis_data:/data]
    networks: [backend]
    healthcheck: {test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"], interval: 5s, timeout: 3s, retries: 20}
    environment: {REDIS_PASSWORD: "${REDIS_PASSWORD}"}

  # One-shot jobs. Order: migrate -> (first install only) load -> provision. Run explicitly, not on every deploy:
  #   docker compose ... run --rm migrate
  migrate:
    build: {context: .., dockerfile: deploy/api/Dockerfile}
    profiles: [jobs]
    environment: {DATABASE_URL: "postgresql://telco_owner:${POSTGRES_OWNER_PASSWORD}@db:5432/telco"}
    command: ["python", "-m", "telco.db", "migrate"]
    networks: [backend]
    depends_on: {db: {condition: service_healthy}}

  api:
    build: {context: .., dockerfile: deploy/api/Dockerfile}
    environment: *api-env
    networks: [backend]
    depends_on: {db: {condition: service_healthy}}
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  mcp-bridge:
    build: {context: .., dockerfile: deploy/api/Dockerfile}
    command: ["python", "-m", "telco_mcp.server"]
    environment:
      TELCO_API_INTERNAL_URL: http://api:8000
      MCP_SERVICE_TOKEN: ${MCP_SERVICE_TOKEN}
      MCP_BRIDGE_TOKEN: ${MCP_BRIDGE_TOKEN}
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8765"
      MCP_ALLOWED_HOSTS: mcp-bridge:*
    networks: [backend]
    read_only: true
    cap_drop: [ALL]
    restart: unless-stopped

  # Hermes Agent built from the pinned upstream commit (MIT). HERMES_HOME is rendered by hermes-init with every
  # builtin toolset disabled; the container has NO database credentials and no app secrets except its own keys.
  hermes-init:
    build: {context: .., dockerfile: deploy/api/Dockerfile}
    command: ["python", "deploy/hermes/render_home.py", "/hermes-home"]
    user: "0"
    environment:
      ROUTER_BASE_URL: http://router:20128/v1
      ROUTER_API_KEY: ${ROUTER_API_KEY}
      MODEL_ID: ${MODEL_ID}
      FALLBACK_MODEL_ID: ${FALLBACK_MODEL_ID:-}
      HERMES_API_KEY: ${HERMES_API_KEY}
      MCP_BRIDGE_URL: http://mcp-bridge:8765/mcp
      MCP_BRIDGE_TOKEN: ${MCP_BRIDGE_TOKEN}
      HERMES_HOST: 0.0.0.0
      HERMES_PORT: "8642"
    volumes: [hermes_home:/hermes-home, ./hermes:/app/deploy/hermes:ro]
    networks: [backend]

  hermes:
    build:
      context: https://github.com/NousResearch/hermes-agent.git#14c59f0b505ea34fb46991784e0a996ceab70dcc
    command: ["hermes", "gateway"]
    environment: {HERMES_HOME: /hermes-home}
    volumes: [hermes_home:/hermes-home]
    networks: [backend]
    depends_on:
      hermes-init: {condition: service_completed_successfully}
      mcp-bridge: {condition: service_started}
    restart: unless-stopped

  router:
    build: {context: .., dockerfile: deploy/9router/Dockerfile}
    volumes: [router_data:/home/router]
    networks: [backend]
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:2.35.7
    environment: *n8n-env
    volumes: [n8n_data:/home/node/.n8n, ../n8n/workflows:/workflows:ro]
    networks: [backend]
    depends_on: {n8n-db: {condition: service_healthy}, redis: {condition: service_healthy}}
    restart: unless-stopped

  n8n-webhook:
    image: n8nio/n8n:2.35.7
    command: ["webhook"]
    environment: *n8n-env
    networks: [backend]
    depends_on: [n8n]
    restart: unless-stopped

  n8n-worker:
    image: n8nio/n8n:2.35.7
    command: ["worker", "--concurrency=5"]
    environment: *n8n-env
    networks: [backend]
    depends_on: [n8n]
    restart: unless-stopped

  dashboard:
    build: {context: .., dockerfile: deploy/dashboard/Dockerfile}
    networks: [backend]
    restart: unless-stopped

  # Public edge: TLS termination (Caddy obtains certificates for PUBLIC_HOSTNAME). Routes:
  #   /webhooks/whatsapp -> api (signature verified there)   /charts/* -> api (signed links)   everything else -> dashboard
  edge:
    image: caddy:2.10.2-alpine
    ports: ["443:443", "80:80"]
    environment: {PUBLIC_HOSTNAME: "${PUBLIC_HOSTNAME}"}
    volumes: [./edge/Caddyfile:/etc/caddy/Caddyfile:ro, caddy_data:/data]
    networks: [backend]
    depends_on: [api, dashboard]
    restart: unless-stopped

networks:
  backend: {}

volumes: {telco_pg: {}, n8n_pg: {}, redis_data: {}, n8n_data: {}, hermes_home: {}, router_data: {}, caddy_data: {}}
